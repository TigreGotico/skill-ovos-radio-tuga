name: Build Tests

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      install_extras: 'test'
      # There is no test/ directory in this repository. The shared workflow
      # runs its test step only `if: inputs.test_path != ''` and documents an
      # empty value as "build/install verification only"; a path that is not
      # there makes pytest exit 4, a usage error, which is why build_tests was
      # red on every python version. Set this back when tests exist.
      test_path: ''
